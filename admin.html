<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargeGrid Hub — Painel Administrativo</title>
  <meta name="description" content="Painel administrativo do eletroposto ChargeGrid Hub - Gestão de estações e faturamento">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/sim.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">ChargeGrid Hub</div>
        <div class="brand-subtitle">Operator View</div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Visão Geral
        </button>
        <button class="nav-item" data-section="stations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Estações
        </button>
        <button class="nav-item" data-section="sessions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Sessões
        </button>
        <button class="nav-item" data-section="billing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Faturamento
        </button>
        <button class="nav-item" data-section="energy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline></svg>
          Energia
        </button>
        <button class="nav-item" data-section="pricing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Tarifação
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-profile">
          <div class="avatar">A</div>
          <div class="admin-info">
            <span class="admin-name">Admin</span>
            <span class="admin-role">Operador</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <h1 class="page-title" id="pageTitle">Visão Geral</h1>
        <div class="header-actions">
          <div class="header-status">
            <span class="peak-indicator" id="peakIndicator">
              <span class="indicator-dot"></span>
              <span class="indicator-text">Calculando...</span>
            </span>
            <span class="live-clock" id="liveClock">00:00:00</span>
          </div>
          <a href="index.html" class="btn-outline">
            Abrir Totem
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          </a>
          <button class="theme-toggle" id="theme-toggle" title="Alternar tema"><span class="material-symbols-outlined">dark_mode</span></button>
        </div>
      </header>

      <div class="content-container" id="contentContainer">
        <!-- Sections will be injected here via JS -->
      </div>
    </main>
  </div>

  <script src="data/mock-data.js"></script>
  <script src="data/site-config.js"></script>
  <script src="data/modbus-map.js"></script>

  <!-- Tarifação (ANEEL): dual-mode, roda igual no navegador e no servidor. -->
  <script src="js/sim/tariff.js"></script>

  <!-- O motor de simulação em si agora roda só no servidor (server/sim/);
       este arquivo conecta por WebSocket e recebe o estado ao vivo — o
       mesmo estado que o tótem vê, daí uma sessão iniciada lá aparecer aqui. -->
  <script src="js/sim-client.js"></script>

  <!-- Ponte com o hardware real (ESP32 + relé) via MQTT — biblioteca local,
       ver nota em index.html. -->
  <script src="js/vendor/mqtt.min.js"></script>
  <script src="js/sim/mqtt-bridge.js"></script>

  <script src="js/pricing.js"></script>
  <script src="js/demo-panel.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
